<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF4C2" />
      <stop offset="30%" stopColor="#DFC072" />
      <stop offset="70%" stopColor="#B3892B" />
      <stop offset="100%" stopColor="#876318" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#B8933A" />
      <stop offset="50%" stopColor="#E9D392" />
      <stop offset="100%" stopColor="#7A5818" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Great Highland Bagpipe Pipes (Drones & Chanters) -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <!-- Bass Drone (Center Tallest) -->
    <path d="M 194 30 L 206 30 L 208 58 Q 200 68 192 58 Z" />
    <rect x="193" y="60" width="14" height="24" rx="3" />
    <rect x="194" y="86" width="12" height="100" rx="2" />
    <rect x="190" y="188" width="20" height="12" rx="2" />
    <rect x="194" y="202" width="12" height="130" rx="2" />
    <rect x="190" y="334" width="20" height="36" rx="4" />

    <!-- Tenor Drone Left -->
    <path d="M 138 98 L 146 98 L 148 122 Q 142 132 136 122 Z" />
    <rect x="135" y="124" width="14" height="20" rx="3" />
    <rect x="136" y="146" width="12" height="80" rx="2" />
    <rect x="132" y="228" width="20" height="10" rx="2" />
    <rect x="136" y="240" width="12" height="96" rx="2" />
    <rect x="132" y="338" width="20" height="32" rx="4" />

    <!-- Tenor Drone Right -->
    <path d="M 254 162 L 262 162 L 264 182 Q 258 192 252 182 Z" />
    <rect x="251" y="184" width="14" height="16" rx="2" />
    <rect x="252" y="202" width="12" height="70" rx="2" />
    <rect x="248" y="274" width="20" height="10" rx="2" />
    <rect x="252" y="286" width="12" height="56" rx="2" />
    <rect x="248" y="344" width="20" height="26" rx="4" />

    <!-- Blowpipe / Pipe Chanter Far Right -->
    <path d="M 304 214 L 308 214 L 310 230 L 302 230 Z" />
    <rect x="300" y="232" width="12" height="36" rx="2" />
    <rect x="298" y="270" width="14" height="8" rx="1" />
    <rect x="301" y="280" width="9" height="64" rx="1.5" />
    <rect x="297" y="346" width="17" height="24" rx="3" />
  </g>

  <!-- 2. Celtic Crescent Swirl / Ring Wrapping Around Base -->
  <path 
    d="M 224 242 C 170 246 124 276 110 326 C 94 382 128 438 196 448 C 264 458 328 416 332 350 C 334 314 316 288 288 276 C 316 310 306 378 256 402 C 208 426 152 396 144 350 C 136 302 176 262 224 242 Z" 
    fill="url(#ringGrad)"
    opacity="0.95"
  />

  <!-- Inner Dynamic Accent Swoosh -->
  <path 
    d="M 250 386 C 290 366 314 326 312 290 C 300 322 276 354 250 386 Z" 
    fill="url(#goldGrad)"
    opacity="0.8"
  />

  <!-- 3. Celtic Lettering Typography: SPUD THE PIPER -->
  <text 
    x="200" 
    y="515" 
    text-anchor="middle" 
    font-family="'Cinzel', 'Georgia', serif" 
    font-size="28" 
    font-weight="bold" 
    letter-spacing="5" 
    fill="url(#goldGrad)"
  >
    SPUD THE PIPER
  </text>

  <!-- 4. Heritage Cursive: Est. 1999 -->
  <text 
    x="200" 
    y="550" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Baskerville', 'Georgia', serif" 
    font-size="22" 
    font-style="italic" 
    letter-spacing="2" 
    fill="#DFBF73"
  >
    Est. 1999
  </text>
</svg>
